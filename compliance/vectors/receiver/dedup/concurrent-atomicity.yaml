id: receiver/dedup/concurrent-atomicity
requirement:
  capability: receiver
  title: Idempotency dedup helper
description: |
  True concurrent-duplicate check for the receiver capability spec's
  "Concurrent dedup calls" scenario: the runner signs one request with a
  fresh id (msg_dedup_atomic_b) and fires it twice concurrently
  (`concurrency: 2`), asserting the two responses are, as an unordered
  multiset, exactly one `accept` and one `duplicate`.
input:
  method: POST
  url: /webhooks
  headers:
    webhook-id: msg_dedup_atomic_b
    webhook-timestamp: "{{now}}"
  body_b64: eyJ0eXBlIjoidGVzdC5oZWxsbyIsInRpbWVzdGFtcCI6IjIwMjYtMDEtMDFUMDA6MDA6MDBaIiwiZGF0YSI6eyJoZWxsbyI6IndvcmxkIn19
secrets:
  - id: primary
    fixture: hmac_primary.yaml
signature_mode: computed
concurrency: 2
expected:
  outcomes: [accept, duplicate]
