id: jwks/public-only
requirement:
  capability: key-management
  title: JWKS publishes only public keys
description: |
  GET /.well-known/webhooks-keys on the receiver under test. Asserts the
  endpoint exists, returns 200 (the JWKS document), and — via
  `response_body_schema` — that no entry in `keys[]` carries a private-key
  field (`d`, the OKP/EC private octet; `k`, the symmetric key value).

  Receiver-under-test prerequisite: a JWKS handler mounted at
  /.well-known/webhooks-keys (the path defined by `key-management`'s
  `JWKS endpoint mounter` requirement).
input:
  method: GET
  url: /.well-known/webhooks-keys
  headers: {}
  body_b64: ""
secrets: []
signature_mode: static
expected:
  outcome: accept
  response_body_schema:
    type: object
    required: ["keys"]
    properties:
      keys:
        type: array
        items:
          type: object
          not:
            anyOf:
              - required: ["d"]
              - required: ["k"]
